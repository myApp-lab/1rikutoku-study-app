name: Generate AI audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'AI voice'
        required: true
        default: 'marin'
        type: choice
        options:
          - marin
          - cedar
          - coral
          - sage
          - shimmer

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate MP3 files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_VOICE: ${{ inputs.voice }}
          AI_TTS_MODEL: gpt-4o-mini-tts
        run: node scripts/generate_ai_audio.mjs
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ai
          if git diff --cached --quiet; then
            echo "No new audio files."
          else
            git commit -m "Add AI audio (${{ inputs.voice }})"
            git push
          fi
